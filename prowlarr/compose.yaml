services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      - ${DOWNLOADS_PATH}:/downloads
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy

    restart: unless-stopped
    
    #networks:
    #  - media-net
