services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      # Pool mergerfs (disques locaux + NAS)
      - ${POOL_PATH}:${POOL_PATH}
      # Anciens chemins, gardés comme alias du pool
      - ${POOL_PATH}:${MEDIA_PATH}
      - ${POOL_PATH}:${DATA_PATH}
      - ${POOL_PATH}/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - media-net