services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: ${PUID}:${PGID}
    network_mode: "host" # Required for DLNA / casting
    environment:
      - JELLYFIN_PublishedServerUrl=http://${SERVER_IP}:8096
    volumes:
      - ./config:/config
      - ./cache:/cache
      # Pool mergerfs (disques locaux + NAS)
      - ${POOL_PATH}:${POOL_PATH}
      # Anciens chemins, gardés comme alias du pool
      - ${POOL_PATH}:${MEDIA_PATH}
      - ${POOL_PATH}:${DATA_PATH}
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

