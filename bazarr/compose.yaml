services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      # REQUIRED: same paths as your media
      - ${MEDIA_PATH}:${MEDIA_PATH}
      - ${DATA_PATH}:${DATA_PATH}
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - media-net
