services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      # Pool mergerfs (disques locaux + NAS)
      - ${POOL_PATH}:${POOL_PATH}
      # Anciens chemins, gardés comme alias du pool
      - ${POOL_PATH}:${MEDIA_PATH}
      - ${POOL_PATH}:${DATA_PATH}
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - media-net
