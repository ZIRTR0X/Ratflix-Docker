services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    network_mode: "host"
    environment:
      - JELLYFIN_DOMAIN=${JELLYFIN_DOMAIN}
      - JELLYSEERR_DOMAIN=${JELLYSEERR_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: